name: CI

# Enforces the "Verify" block that every OneTag ticket ends with, so acceptance
# criteria are gates rather than honour-system requests.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm, at the version package.json's packageManager pins (ONE-147). It
      # goes before setup-node, which caches pnpm's store.
      - uses: pnpm/action-setup@v4

      # Node 22, not 20: @supabase/supabase-js 2.116 and its sub-packages
      # declare "engines": { "node": ">=22.0.0" }, and pnpm 11 needs 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test --ci

      - name: No raw hex outside the token layer
        run: sh scripts/check-no-raw-hex.sh

      # Bundles the app as Metro and Babel will for a build or an update.
      # Typecheck, lint and Jest never load either, so a package they can't
      # resolve, or a broken import or route, passed every check above and
      # first failed at `pnpm publish:preview` (ONE-147). No env vars needed:
      # bundling inlines EXPO_PUBLIC_* without running the app.
      - name: Bundle the app (iOS)
        run: pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/expo-export"

  migrations:
    # The name is kept so an existing required check still matches it. The
    # job also runs the pgTAP suite (ONE-111) and the API checks (ONE-114).
    name: Migrations apply from scratch
    runs-on: ubuntu-latest
    # Only when the schema, the data layer or their checks changed. Spinning
    # up Supabase for a CSS change is waste.
    if: github.event_name == 'pull_request'
    steps:
      # A pull request checks out GitHub's merge commit. Two levels bring its
      # parents, so the PR's own changes are a diff against the first parent,
      # the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect schema and data-layer changes
        id: changed
        run: |
          # The diff runs on its own, so a failure fails the job rather than
          # reading as "nothing changed". A three-dot diff in a shallow clone
          # found no merge base and did exactly that on every PR, so no step
          # below had ever run (found in ONE-114).
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if printf '%s\n' "$changed" | grep -qE '^(supabase/|features/|services/|__tests__/api/|jest\.api\.config\.js$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.run == 'true'
        with:
          version: latest

      # Applies every migration to a throwaway local stack, in order, from
      # nothing. Catches the failure mode that matters most: a migration that
      # works against the current production schema but not from a clean slate.
      # Only the API the app talks to starts with it: the gateway, auth and
      # PostgREST.
      - name: Apply migrations to a clean local stack
        if: steps.changed.outputs.run == 'true'
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Show migration status
        if: steps.changed.outputs.run == 'true'
        run: supabase migration list --local

      # Every RLS rule, function privilege and trigger the schema promises is
      # pinned in supabase/tests. Until ONE-111 nothing ran them in CI, so a
      # change that opened a table to anon merged green.
      - name: Run the pgTAP suite
        if: steps.changed.outputs.run == 'true'
        run: supabase test db

      - uses: pnpm/action-setup@v4
        if: steps.changed.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # The app's own data layer against that stack, as signed-in throwaway
      # accounts: select strings, the URL limit, the row cap and permissions,
      # which neither pgTAP nor the mocked Jest suites can see (ONE-114).
      - name: Run the API checks
        if: steps.changed.outputs.run == 'true'
        run: |
          eval "$(supabase status -o env | sed -n \
            -e 's/^API_URL=/export SUPABASE_URL=/p' \
            -e 's/^ANON_KEY=/export SUPABASE_ANON_KEY=/p' \
            -e 's/^SERVICE_ROLE_KEY=/export SUPABASE_SERVICE_ROLE_KEY=/p')"
          pnpm check:api --ci

      # The development seed (supabase/seeds/dev.sql) has to keep up with the
      # schema, or the next `pnpm db:seed` fails for whoever runs it. It
      # goes in last, so no check above sees its rows, and twice, because a
      # second run must be a no-op.
      - name: Apply the development seed, twice
        if: steps.changed.outputs.run == 'true'
        run: |
          supabase db query --local -f supabase/seeds/dev.sql
          supabase db query --local -f supabase/seeds/dev.sql
