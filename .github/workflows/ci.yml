name: CI

# Enforces the "Verify" block that every OneTag ticket ends with, so acceptance
# criteria are gates rather than honour-system requests.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: @supabase/supabase-js 2.116 and its sub-packages
      # declare "engines": { "node": ">=22.0.0" }.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      - name: No raw hex outside the token layer
        run: sh scripts/check-no-raw-hex.sh

  migrations:
    name: Migrations apply from scratch
    runs-on: ubuntu-latest
    # Only when schema changed. Spinning up Postgres for a CSS change is waste.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Detect migration changes
        id: changed
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^supabase/migrations/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.run == 'true'
        with:
          version: latest

      # Applies every migration to a throwaway local Postgres, in order, from
      # nothing. Catches the failure mode that matters most: a migration that
      # works against the current production schema but not from a clean slate.
      - name: Apply migrations to a clean database
        if: steps.changed.outputs.run == 'true'
        run: supabase db start

      - name: Show migration status
        if: steps.changed.outputs.run == 'true'
        run: supabase migration list --local
